[package]
name = "win_hello_bridge"
version = "2.0.0"
authors = ["Takaya Saeki <abc.tkys+pub@gmail.com>"]
edition = "2018"
license = "MIT"
description = "Windows CLI that signs a challenge after a Windows Hello gesture"
repository = "https://github.com/312-dev/wsl-hello-sudo"

[[bin]]
name = "WindowsHelloBridge"
path = "src/main.rs"

[dependencies]
windows = { version = "0.32", features = ["alloc", "Foundation", "Security_Credentials", "Security_Cryptography", "Storage_Streams", "UI_Popups", "Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }